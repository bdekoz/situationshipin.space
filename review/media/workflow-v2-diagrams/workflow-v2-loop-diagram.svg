<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 530" width="1540" height="530" role="img" aria-labelledby="diagram-title" font-family="DejaVu Sans">
  <title id="diagram-title">Workflow</title>
